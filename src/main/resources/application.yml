spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:${POSTGRES_DB:audex}}}
    username: ${PGUSER:${POSTGRES_USER:audex}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD:audex}}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: always   # the app shows these plain-English messages (for example "Username or password is incorrect.")

audex:
  app-url: ${AUDEX_APP_URL:http://localhost:5173}
  auth:
    # First-time setup is only possible while no account exists, and only with this code. Leave unset to switch setup off.
    setup-code: ${AUDEX_SETUP_CODE:}
    registration-enabled: ${AUDEX_REGISTRATION_ENABLED:false}
  billing:
    enabled: ${AUDEX_BILLING_ENABLED:false}
    checkout-enabled: ${AUDEX_CHECKOUT_ENABLED:false}
    live-payments: ${AUDEX_LIVE_PAYMENTS:false}
    secret-key: ${PAYSTACK_SECRET_KEY:}
    private-key: ${AUDEX_ENTITLEMENT_PRIVATE_KEY:}
    public-key: ${AUDEX_ENTITLEMENT_PUBLIC_KEY:}
    bootstrap-admin-id: ${AUDEX_BOOTSTRAP_ADMIN_ID:}
    provider-plans:
      solo-monthly: ${PAYSTACK_SOLO_MONTHLY_PLAN:}
      solo-annually: ${PAYSTACK_SOLO_ANNUAL_PLAN:}
      professional-monthly: ${PAYSTACK_PROFESSIONAL_MONTHLY_PLAN:}
      professional-annually: ${PAYSTACK_PROFESSIONAL_ANNUAL_PLAN:}
  mail:
    from: ${AUDEX_MAIL_FROM:no-reply@audex.local}
  allowed-origins: ${AUDEX_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # S3 credentials use Railway's BUCKET, ACCESS_KEY_ID, ENDPOINT, REGION and SECRET_ACCESS_KEY variables.
    bucket: ${BUCKET:}
    endpoint: ${ENDPOINT:}
    region: ${REGION:auto}
    access-key: ${ACCESS_KEY_ID:}
    secret-key: ${SECRET_ACCESS_KEY:}
